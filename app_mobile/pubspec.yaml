name: app_mobile
description: "A mobile application for Niaga Solusi Mandiri"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  flutter_inappwebview: ^6.0.0
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  dio: ^5.7.0
  tanstack_query: ^1.2.7
  provider: ^6.0.5
  
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  
  pusher_channels_flutter: ^2.0.2
  go_router: ^17.4.0
  
  image_picker: ^1.1.2
  file_picker: ^12.0.0-beta.7
  fluttertoast: ^10.0.0
  
  flutter_spinkit: ^5.2.2
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  pull_to_refresh: ^2.0.0
  
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/logo-nsm.png